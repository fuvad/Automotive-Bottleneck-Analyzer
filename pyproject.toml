[project]
name = "automotive-bottleneck-analyzer"
version = "0.1.0"
description = "Evidence-backed automotive body-shop bottleneck analysis prototype"
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "SQLAlchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "pgvector>=0.3,<1.0",
    "alembic>=1.13,<2.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "simpy>=4.0,<5.0",
    "langgraph>=1.0,<2.0",
    "langsmith>=0.4,<1.0",
]

[tool.poetry]
packages = [{ include = "bottleneck_analyzer", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<10.0"
pytest-cov = ">=5.0,<8.0"
ruff = ">=0.8,<1.0"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"
